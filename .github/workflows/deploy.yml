name: Deploy site
# Deploy only from main. A push to any other branch must never publish the site.
#
# Three layers, because the trigger filter alone only binds branches that carry
# this version of the file (GitHub runs the workflow from the pushed commit):
#   1. the trigger below only fires for main
#   2. the job is skipped unless the ref is main
#   3. the job deploys through the github-pages environment, whose deployment
#      branch policy (repo settings) allows main only
on:
  # Manual re-run for a failed deploy. From any ref other than main the job is
  # skipped by its `if`, and the environment policy rejects it as well.
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**/*.html"
      - "**/*.css"
      - "**/*.ts"
      - "package*.json"
      - "tsconfig.json"
      - "assets/**"
      - "vendor/**"
      - ".github/workflows/deploy.yml"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    # Second guard, in case a trigger is added later without a branch filter.
    if: github.ref == 'refs/heads/main'
    # Third guard: makes the environment's main-only branch policy apply to
    # this job. Without `environment:` the policy does not bind it.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: "npm"
      - name: Install and build
        run: npm ci --include=dev && npm run build
        env:
          NODE_ENV: production
          VITE_CLOUDFLARE_TOKEN: "${{ secrets.CLOUDFLARE_TOKEN }}"
      - name: Setup gh pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload artifacts
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
